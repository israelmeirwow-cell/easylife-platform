<div ref="{{ rootRef }}" dir="rtl" lang="he" style="min-height:100vh; background:#f5f7fb;">

            <div style="width:32px; height:32px; border-radius:999px; border:1px solid rgba(15,23,42,.08); background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600;">י</div>

        </div>
      </div>
    </div>

          <span dangerouslySetInnerHTML="{{ n.icon }}"></span>
          <span style="white-space:nowrap;">{{ n.label }}</span>

  <!-- ===== BODY ===== -->
  <main style="max-width:820px; margin:0 auto; padding:28px 28px 64px;">

    <!-- page header -->
    <div style="margin-bottom:22px; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px;">
      <div>
        <div style="font-size:10px; letter-spacing:.25em; text-transform:uppercase; color:#94a3b8; font-family:'Space Grotesk',sans-serif;">Live Stream</div>
        <h1 style="margin:6px 0 0; font-size:26px; font-weight:600; letter-spacing:-.01em;">פיד חי</h1>
        <p style="margin:7px 0 0; font-size:14.5px; color:#55627a; max-width:34em; line-height:1.55;">כל מה שקורה בעסק — סוכנים, אנשים ולקוחות — בזרם אחד, ברגע שזה קורה.</p>
      </div>
      <span style="display:flex; align-items:center; gap:8px; border:1px solid rgba(15,23,42,.08); background:#fff; border-radius:999px; padding:7px 14px; font-size:12.5px; box-shadow:0 1px 2px rgba(15,23,42,.04);">

        <span style="font-weight:600; color:#12805c;">מחובר</span>
      </span>
    </div>

    <!-- filter chips -->
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:22px;">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
        <button onClick="{{ f.onClick }}" style="{{ f.style }}">
          {{ f.label }}<sc-if value="{{ f.showCount }}" hint-placeholder-val="{{ false }}"><span style="margin-inline-start:6px; opacity:.7;">{{ f.count }}</span></sc-if>
        </button>
      </sc-for>
    </div>

    <!-- timeline -->
    <div style="position:relative;">
      <div style="pointer-events:none; position:absolute; top:8px; bottom:8px; inset-inline-start:25px; width:1px; background:linear-gradient(to bottom, #0e8ba0 0%, rgba(14,139,160,.25) 18%, rgba(15,23,42,.07) 100%);"></div>

        <sc-for list="{{ events }}" as="ev" hint-placeholder-count="8">

            </div>
            <div class="glass-card" style="flex:1; min-width:0; padding:15px 16px;">
              <div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
                <span style="font-size:14px; font-weight:600;">{{ ev.label }}</span>
                <span style="{{ ev.actorStyle }}">{{ ev.actorLabel }}</span>
                <span style="font-size:12px; color:#94a3b8;">{{ ev.actorId }}</span>
                <time style="margin-inline-start:auto; flex:none; font-size:12px; color:#94a3b8;" class="tabular-nums">{{ ev.time }}</time>
              </div>
              <p style="margin:6px 0 0; font-size:13.5px; color:#55627a; line-height:1.5;">{{ ev.summary }}</p>
            </div>
          </article>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>

      const s = Math.round((now - ms) / 1000);
      if (s < 60) return 'ממש עכשיו';
      const m = Math.round(s / 60); if (m < 60) return `לפני ${m} דק׳`;
      const h = Math.round(m / 60); if (h < 24) return `לפני ${h} שע׳`;
      return `לפני ${Math.round(h/24)} ימים`;
    };
    const events = list.map((e, i) => {
      const meta = VERB[e.verb];
      return {
        icon: svg(meta.icon, 16), tint: meta.tint, label: meta.label,
        actorLabel: ACTOR[e.actor].label, actorStyle: pill(e.actor), actorId: e.actorId,
        time: rel(e.ts), summary: e.summary,
        anim: e.fresh ? `animation:feed-in .45s cubic-bezier(.22,1,.36,1) both;` : `animation:feed-in .4s cubic-bezier(.22,1,.36,1) both; animation-delay:${Math.min(i,8)*45}ms;`,
      };
    });

    // ---- filters ----
    const counts = {
      all: raw.length,
      agents: raw.filter(isAgent).length,
      sales: raw.filter(e=>cat(e.verb)==='sales').length,
      leads: raw.filter(e=>cat(e.verb)==='leads').length,
      messages: raw.filter(e=>cat(e.verb)==='messages').length,
    };
    const chipOn = 'cursor:pointer; font-family:inherit; border-radius:999px; padding:8px 15px; font-size:13px; font-weight:600; border:1px solid #0e8ba0; background:#0e8ba0; color:#fff;';
    const chipOff = 'cursor:pointer; font-family:inherit; border-radius:999px; padding:8px 15px; font-size:13px; font-weight:500; border:1px solid rgba(15,23,42,.16); background:#fff; color:#55627a;';
    const mk = (key, label) => ({ label, count: counts[key], showCount: true,
      style: this.state.filter === key ? chipOn : chipOff,
      onClick: () => this.setState({ filter: key }) });
    const filters = [ mk('all','הכל'), mk('agents','סוכנים'), mk('sales','מכירות'), mk('leads','לידים'), mk('messages','הודעות') ];

    return { navItems, events, filters, rootRef: (el) => { this.root = el; } };
  }

  _seed() {
    const m = 60000, h = 3600000;
    const base = Date.now();
    return [
      { verb:'won', actor:'agent', actorId:'סוכן מכירות', ts: base - 4*m, summary:'חברת שיפוצים · חבילת פרו — ₪84,000' },
      { verb:'message', actor:'agent', actorId:'סוכן וואטסאפ', ts: base - 11*m, summary:'לקוח שאל על שעות פעילות — נענה אוטומטית' },
      { verb:'lead', actor:'agent', actorId:'סוכן לידים', ts: base - 23*m, summary:'ליד מאינסטגרם — מעוניין בחבילת וידאו' },
      { verb:'payment', actor:'contact', actorId:'קליניקת נועה', ts: base - 38*m, summary:'מנוי חודשי — ₪349' },
      { verb:'memory', actor:'system', actorId:'מוח מרכזי', ts: base - 52*m, summary:'המוח למד: הרשת מעדיפה פגישות בימי ג׳' },
      { verb:'order', actor:'contact', actorId:'בית קפה עלית', ts: base - 1*h, summary:'הזמנה חדשה מהחנות — ₪1,240' },
      { verb:'leadstage', actor:'human', actorId:'ישראל', ts: base - 1*h - 20*m, summary:'ליד «סטודיו מיכל» הועבר לשלב «מוכשר»' },
      { verb:'approval', actor:'human', actorId:'ישראל', ts: base - 2*h, summary:'אושר פרסום פוסט אינסטגרם שהכין סוכן התוכן' },
      { verb:'message', actor:'contact', actorId:'מוסך דהן', ts: base - 2*h - 40*m, summary:'«אפשר לקבוע תור לשבוע הבא?»' },
    ];
  }

  componentDidMount() {
    this.setState({ events: this._seed() });
    const templates = [
      { verb:'lead', actor:'agent', actorId:'סוכן לידים', summary:'ליד חדש מפייסבוק — בקשת הצעת מחיר' },
      { verb:'message', actor:'agent', actorId:'סוכן וואטסאפ', summary:'נשלחה תזכורת תור ללקוח אוטומטית' },
      { verb:'payment', actor:'contact', actorId:'רשת אופנה', summary:'תשלום התקבל — ₪2,900' },
      { verb:'won', actor:'agent', actorId:'סוכן מכירות', summary:'סוכנות נדל״ן · סוכן לידים + דוחות — ₪38,000' },
      { verb:'memory', actor:'system', actorId:'מוח מרכזי', summary:'המוח עדכן פרופיל לקוח לפי שיחה אחרונה' },
      { verb:'order', actor:'contact', actorId:'בית קפה עלית', summary:'הזמנה חדשה מהחנות — ₪860' },
    ];
    let n = 0;
    this._live = setInterval(() => {
      const t = templates[n % templates.length]; n++;
      const ev = { ...t, ts: Date.now(), fresh: true };
      this.setState(s => ({ events: [ev, ...(s.events || this._seed()).map(e => ({ ...e, fresh:false }))].slice(0, 60) }));
    }, 7000);
    this._timer = setInterval(() => this.forceUpdate(), 30000);
  }

  componentWillUnmount() { clearInterval(this._live); clearInterval(this._timer); }
}
</script>
