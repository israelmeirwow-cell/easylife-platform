<!doctype html>
<html lang="he" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Arial Hebrew";
        src: local("Arial Hebrew");
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Arial Hebrew", sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        direction: rtl;
        background: #1a1410;
      }
      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .bg {
        position: absolute;
        inset: 0;
      }
      /* ---- Scene 1 : hook ---- */
      #s1 .bg {
        background: radial-gradient(120% 90% at 50% 15%, #ffe6b8 0%, #f2b56a 45%, #d98a3d 100%);
      }
      .s1-kicker {
        position: absolute;
        top: 560px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 6px;
        color: #7a3d12;
      }
      .s1-title {
        position: absolute;
        top: 660px;
        left: 60px;
        right: 60px;
        text-align: center;
        font-size: 150px;
        line-height: 1.02;
        font-weight: 900;
        color: #4a2208;
      }
      .s1-title .accent { color: #8a2318; }
      .s1-sub {
        position: absolute;
        top: 1090px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 52px;
        font-weight: 500;
        color: #7a3d12;
      }
      /* ---- Scene 2 : product ---- */
      #s2 .bg {
        background: linear-gradient(160deg, #fff7ec 0%, #ffe9cf 100%);
      }
      .plate {
        position: absolute;
        top: 470px;
        left: 50%;
        margin-left: -330px;
        width: 660px;
        height: 660px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, #ffffff 0%, #f3e7d6 78%, #e2cdb2 100%);
        box-shadow: 0 40px 80px rgba(120, 70, 20, 0.25);
      }
      .cup-wrap {
        position: absolute;
        top: 560px;
        left: 50%;
        margin-left: -150px;
        width: 300px;
        height: 470px;
      }
      .cup-base {
        position: absolute;
        bottom: 0;
        left: 40px;
        width: 220px;
        height: 210px;
        background: repeating-linear-gradient(90deg, #d98a3d 0 18px, #c2762f 18px 36px);
        clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%);
        border-radius: 0 0 16px 16px;
      }
      .cup-cream {
        position: absolute;
        bottom: 185px;
        left: 12px;
        width: 276px;
        height: 200px;
        background: radial-gradient(circle at 50% 60%, #fff4f7 0%, #f6c9d8 60%, #e89ab6 100%);
        border-radius: 50% 50% 44% 44%;
      }
      .cherry {
        position: absolute;
        bottom: 350px;
        left: 50%;
        margin-left: -28px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 32%, #ff6b6b 0%, #c0392b 100%);
      }
      .s2-name {
        position: absolute;
        top: 1210px;
        left: 40px;
        right: 40px;
        text-align: center;
        font-size: 96px;
        font-weight: 900;
        color: #4a2208;
      }
      .s2-desc {
        position: absolute;
        top: 1340px;
        left: 80px;
        right: 80px;
        text-align: center;
        font-size: 46px;
        font-weight: 500;
        color: #96774f;
      }
      .s2-price {
        position: absolute;
        top: 1500px;
        left: 50%;
        margin-left: -190px;
        width: 380px;
        height: 130px;
        border-radius: 65px;
        background: #a8521a;
        color: #fff;
        font-size: 74px;
        font-weight: 900;
        text-align: center;
        line-height: 130px;
        box-shadow: 0 18px 40px rgba(217, 138, 61, 0.5);
      }
      /* ---- Scene 3 : CTA ---- */
      #s3 .bg {
        background: radial-gradient(120% 90% at 50% 85%, #4a2208 0%, #2a1408 100%);
      }
      .s3-title {
        position: absolute;
        top: 720px;
        left: 60px;
        right: 60px;
        text-align: center;
        font-size: 140px;
        line-height: 1.05;
        font-weight: 900;
        color: #ffe6b8;
      }
      .s3-sub {
        position: absolute;
        top: 1030px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 56px;
        font-weight: 500;
        color: #f2b56a;
      }
      .s3-cta {
        position: absolute;
        top: 1210px;
        left: 50%;
        margin-left: -290px;
        width: 580px;
        height: 150px;
        border-radius: 75px;
        background: linear-gradient(90deg, #ffd88a, #f2b56a);
        color: #4a2208;
        font-size: 60px;
        font-weight: 900;
        text-align: center;
        line-height: 150px;
      }
      .brand {
        position: absolute;
        bottom: 150px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #d98a3d;
      }
      /* progress bar across the whole reel */
      #progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 10px;
        width: 1080px;
        transform-origin: right center;
        background: #ffffff;
        opacity: 0.9;
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="reel"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="12"
    >
      <!-- Scene 1 — HOOK -->
      <div id="s1" class="scene">
        <div class="bg"></div>
        <div class="s1-kicker">מתוק וקל</div>
        <div class="s1-title">הכל למסיבה<br /><span class="accent">המושלמת</span></div>
        <div class="s1-sub">אפייה · כלים · קישוט — במקום אחד</div>
      </div>

      <!-- Scene 2 — PRODUCT -->
      <div id="s2" class="scene">
        <div class="bg"></div>
        <div class="plate"></div>
        <div class="cup-wrap">
          <div class="cup-base"></div>
          <div class="cup-cream"></div>
          <div class="cherry"></div>
        </div>
        <div class="s2-name">מארז יוקרה למסיבה</div>
        <div class="s2-desc">24 צלחות · כוסות זהב · מפית פשתן</div>
        <div class="s2-price">₪89</div>
      </div>

      <!-- Scene 3 — CTA -->
      <div id="s3" class="scene">
        <div class="bg"></div>
        <div class="s3-title">הזמינו<br />עכשיו</div>
        <div class="s3-sub">משלוח חינם עד הבית</div>
        <div class="s3-cta">לחנות שלנו ←</div>
        <div class="brand">מתוק וקל · MATOK VEKAL</div>
      </div>

      <div id="progress"></div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0 - 4s)
        tl.fromTo("#s1", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
        tl.fromTo(".s1-kicker", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7 }, 0.2);
        tl.fromTo(".s1-title", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.45);
        tl.fromTo(".s1-sub", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7 }, 1.0);
        tl.to(".s1-title", { scale: 1.05, duration: 2.2, ease: "sine.inOut" }, 1.4);
        tl.to("#s1", { opacity: 0, duration: 0.5 }, 3.7);

        // Scene 2 (4 - 8.5s)
        tl.fromTo("#s2", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.9);
        tl.fromTo(".plate", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 4.1);
        tl.fromTo(".cup-wrap", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)" }, 4.4);
        tl.fromTo(".s2-name", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6 }, 4.9);
        tl.fromTo(".s2-desc", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6 }, 5.2);
        tl.fromTo(".s2-price", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 5.6);
        tl.to(".cup-wrap", { y: -18, duration: 1.4, ease: "sine.inOut" }, 6.2);
        tl.to("#s2", { opacity: 0, duration: 0.5 }, 8.2);

        // Scene 3 (8.5 - 12s)
        tl.fromTo("#s3", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 8.4);
        tl.fromTo(".s3-title", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.5)" }, 8.6);
        tl.fromTo(".s3-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6 }, 9.2);
        tl.fromTo(".s3-cta", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.6)" }, 9.5);
        tl.to(".s3-cta", { scale: 1.06, duration: 0.8, ease: "sine.inOut" }, 10.4);
        tl.fromTo(".brand", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 9.9);

        // progress bar shrinks right-to-left across the full 12s
        tl.fromTo("#progress", { scaleX: 1 }, { scaleX: 0, duration: 12, ease: "none" }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines["reel"] = tl;
      </script>
    </div>
  </body>
</html>
